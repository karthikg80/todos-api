[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["main.py", "mcp_client.py"]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_configs = true
